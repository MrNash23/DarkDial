name: darkdial
description: Menu-bar service of the Darkdial Lightroom controller.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  darkdial_core:
    path: packages/darkdial_core
  flutter_midi_command: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icons/
    - assets/tray/
    # The Lightroom plugin, installed by the app into Lightroom's Modules folder.
    # assets/plugin is a symlink to ../../plugin/Darkdial.lrplugin.
    - assets/plugin/
